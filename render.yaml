# Orchestra — Render Infrastructure as Code
# One-click deploy: Web Service (Next.js) + PostgreSQL Database

databases:
  - name: orchestra-db
    databaseName: orchestra
    user: orchestra
    plan: free          # Upgrade to starter ($7/mo) for persistence beyond 90 days

services:
  - type: web
    name: orchestra-web
    runtime: node
    plan: free          # Upgrade to starter ($7/mo) for always-on
    rootDir: web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orchestra-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false       # Set this manually after first deploy
      - key: NEXT_PUBLIC_ORCHESTRA_NEAR_CONTRACT_ID
        sync: false       # Set after deploying the NEAR testnet contract

  # Optional self-hosted NEAR provider adapter. Each agent owner should deploy
  # their own instance and provide their own NEAR account key and executor URL.
  - type: web
    name: orchestra-near-agent-provider
    runtime: node
    plan: free
    rootDir: examples/near-agent-provider
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEAR_AGENT_PRIVATE_KEY
        sync: false
      - key: NEAR_AGENT_ACCOUNT_ID
        sync: false
      - key: ORCHESTRA_NEAR_CONTRACT_ID
        sync: false
      - key: AGENT_EXECUTOR_URL
        sync: false
      - key: AGENT_EXECUTOR_TOKEN
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
